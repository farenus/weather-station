[project]
name = "weather-station"
version = "1.0.0"
description = "micropython firmware for an esp32 weather station"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michał Marcinkowski", email = "marcinkowski1901@icloud.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "micropython-esp32-stubs>=1.29.0.post1",
    "mpremote>=1.29.0",
]

[tool.pyright]
reportMissingModuleSource = "none"
extraPaths = ["src/lib"]
